<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#ringGrad)" stroke-width="4" />

  <!-- Outer Orbit Waves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" />

  <!-- Central Diamond / Gemini Brain Structure -->
  <g filter="url(#glow)">
    <polygon points="256,90 380,210 256,420 132,210" fill="url(#gemGrad)" opacity="0.95" />
    <!-- Facets -->
    <polygon points="256,90 256,420 380,210" fill="#ffffff" opacity="0.15" />
    <polygon points="256,90 200,210 256,270" fill="#ffffff" opacity="0.25" />
    <polygon points="256,90 312,210 256,270" fill="#000000" opacity="0.1" />
    <polygon points="200,210 256,270 256,420 132,210" fill="#000000" opacity="0.2" />
    <polygon points="312,210 256,270 256,420 380,210" fill="#ffffff" opacity="0.18" />
  </g>

  <!-- Sound / Live Voice Waveforms -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="216" y1="256" x2="216" y2="284" />
    <line x1="236" y1="240" x2="236" y2="300" />
    <line x1="256" y1="228" x2="256" y2="312" />
    <line x1="276" y1="240" x2="276" y2="300" />
    <line x1="296" y1="256" x2="296" y2="284" />
  </g>

  <!-- Crown / Sovereign Core Indicator -->
  <circle cx="256" cy="140" r="10" fill="#38bdf8" />
  <circle cx="256" cy="140" r="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
</svg>
